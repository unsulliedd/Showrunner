[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "showrunner"
dynamic = ["version"]
description = "Takes TV shows and movies to finished: subtitles, tracks, MKV, metadata, names, cover and chapters."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# The lowest versions are the ones the suite runs against; older ones are untested.
dependencies = [
    "PySide6>=6.12",
    "babelfish>=0.6",
    "charset-normalizer>=3.5",
    "langdetect>=1.0.9",
    "platformdirs>=4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-qt>=4.5",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
]

[project.scripts]
showrunner-cli = "showrunner.cli.main:main"

# A GUI script is launched without a console window on Windows.
[project.gui-scripts]
showrunner = "showrunner.ui.app:main"

[tool.hatch.version]
path = "src/showrunner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/showrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test modules in mirrored folders may share a file name. Tests run in worker processes, one per core; past eight
# the windows the UI tests open contend for the machine and the run gets no faster. `-n 0` runs in this process.
addopts = "--import-mode=importlib -n auto --maxprocesses=8"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PT", "RUF"]
