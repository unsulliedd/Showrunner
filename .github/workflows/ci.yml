name: CI

# Lint and tests on Linux for every push and pull request. Showrunner is built for Windows; the tests of what only
# Windows has (the Recycle Bin, opening files with their program) skip elsewhere. MKVToolNix and FFmpeg are not
# installed on the runner: the tests that need them skip, and the rest run against their own stand-ins.
on:
  push:
  pull_request:

# A newer push to the same branch or pull request stops the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      # The runner has no display and no GPU: Qt renders to memory, and Qt Quick draws in software.
      # (tests/conftest.py sets the offscreen platform as well.)
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4

      # The libraries the Qt that ships with PySide6 loads, even when it draws nothing on screen.
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: pytest
